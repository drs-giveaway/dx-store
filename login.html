<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b18">
<title>Masuk | DX STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 10%,#173d72 0,transparent 36%),radial-gradient(circle at 90% 85%,#39256f 0,transparent 34%),#070b18;color:#f4f8ff;font-family:Inter,sans-serif}
.auth-shell{width:min(980px,100%);min-height:590px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid #51e5ff40;border-radius:28px;background:#0d1830;box-shadow:0 24px 90px #0008}
.brand-side{padding:48px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 50% 45%,#238fff40,transparent 48%),linear-gradient(145deg,#13284a,#101329)}
.logo{font-size:25px;font-weight:900;letter-spacing:2px}.logo span,.accent{color:#51e5ff}.visual{display:grid;place-items:center;text-align:center}.visual img{width:min(100%,330px);max-height:320px;object-fit:contain;filter:drop-shadow(0 0 25px #24baff70)}.visual h1{font-size:34px;line-height:1.15;margin:14px 0}
.visual p,.muted{color:#aab8d0;line-height:1.7;font-size:14px}
.mascot-stage{position:relative;width:min(100%,330px);height:320px;display:grid;place-items:center;isolation:isolate}
.mascot-stage img{position:relative;z-index:1;width:100%;height:100%;max-height:320px;object-fit:contain;filter:drop-shadow(0 0 25px #24baff70);transform-origin:50% 80%;animation:mascotIdle 3.8s ease-in-out infinite}
.mascot-mouth{position:absolute;z-index:2;left:50%;top:43%;width:13px;height:4px;transform:translateX(-50%);border-radius:50% 50% 60% 60%;background:#17213b;box-shadow:0 0 5px #51e5ff88;opacity:.9;pointer-events:none}
.mascot-stage.talking img{animation:mascotTalkBody .48s ease-in-out infinite alternate}
.mascot-stage.talking .mascot-mouth{animation:mascotLipSync .19s ease-in-out infinite alternate}
.mascot-speech{width:min(100%,340px);min-height:42px;margin:4px auto 8px;padding:10px 13px;border:1px solid #51e5ff55;border-radius:12px;background:#071226aa;color:#eaf7ff;font-size:12px;line-height:1.55;text-align:left}
.mascot-listen{min-height:38px;margin:0 0 8px;padding:0 15px;border:1px solid #51e5ff66;border-radius:20px;background:#12345b;color:#8feaff;font-size:11px}
@keyframes mascotIdle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(1deg)}}
@keyframes mascotTalkBody{from{transform:translateY(-2px) rotate(-1deg) scale(1)}to{transform:translateY(2px) rotate(1deg) scale(1.015)}}
@keyframes mascotLipSync{from{height:3px;width:11px;border-radius:50%}to{height:12px;width:9px;border-radius:45% 45% 55% 55%}}

.form-side{padding:54px 44px;display:flex;flex-direction:column;justify-content:center}.form-side h2{font-size:29px;margin:0 0 8px}.form-side>p{margin:0 0 28px;color:#aab8d0;font-size:14px}
form{display:grid;gap:13px}label{font-size:12px;color:#cbd5e1;font-weight:700}input{width:100%;margin-top:7px;padding:15px;border:1px solid #314968;border-radius:11px;background:#071226;color:white;outline:none}input:focus{border-color:#51e5ff;box-shadow:0 0 0 3px #51e5ff18}
button{min-height:48px;border:0;border-radius:11px;background:linear-gradient(110deg,#168fff,#7954e9);color:white;font-weight:800;cursor:pointer;margin-top:5px}button:disabled{opacity:.6;cursor:wait}.switch{background:transparent;border:1px solid #51e5ff55;color:#51e5ff;margin-top:12px}.message{min-height:38px;color:#51e5ff;font-size:12px;line-height:1.5;margin-top:15px}.back{display:inline-block;color:#9eb1ce;text-decoration:none;font-size:12px;margin-top:12px}
@keyframes mascotLipSyncMobile{from{height:2px;width:6px}to{height:7px;width:5px}}
@media(max-width:720px){.auth-shell{grid-template-columns:1fr;max-width:470px;min-height:auto}.brand-side{padding:22px 25px 10px;min-height:205px}.mascot-stage{width:120px;height:115px}.mascot-stage img{width:120px;height:115px}.mascot-mouth{top:43%;width:7px;height:2px}.mascot-stage.talking .mascot-mouth{animation:mascotLipSyncMobile .19s ease-in-out infinite alternate}.mascot-speech{font-size:11px;min-height:34px;padding:7px 9px}.mascot-listen{min-height:32px;font-size:10px;padding:0 12px}.visual h1{font-size:22px;margin:5px}.visual p{font-size:12px;margin:0 0 10px}.brand-foot{display:none}.form-side{padding:32px 25px 28px}.form-side h2{font-size:25px}}
</style>
</head>
<body>
<main class="auth-shell">
<section class="brand-side">
<div class="logo">DX<span>STORE</span></div>
<div class="visual">
<div class="mascot-stage" id="mascotStage">
<img id="loginMascot" src="39976-removebg-preview.png" alt="Maskot DX STORE">
<span class="mascot-mouth" aria-hidden="true"></span>
</div>
<div class="mascot-speech" id="mascotSpeech" aria-live="polite">Halo! Aku DX-01. Selamat datang di DX STORE.</div>
<button class="mascot-listen" id="mascotListen" type="button">▶ Dengarkan sapaan DX-01</button>
<h1>YOUR DIGITAL<br><span class="accent">WORLD STARTS HERE.</span></h1>
<p>Masuk untuk melanjutkan ke marketplace DX STORE.</p>
</div>
<div class="brand-foot muted">DX STORE · Digital Products &amp; Game Marketplace</div>
</section>
<section class="form-side">
<h2 id="formTitle">Selamat datang kembali</h2>
<p id="formSubtitle">Masuk ke akun DX STORE untuk membuka beranda.</p>
<label for="countrySelect">Negara / Country<select id="countrySelect" autocomplete="country" style="width:100%;margin-top:7px;padding:15px;border:1px solid #314968;border-radius:11px;background:#071226;color:white"><option value="ID">🇮🇩 ID</option><option value="MY">🇲🇾 MY</option><option value="SG">🇸🇬 SG</option><option value="US">🇺🇸 US</option><option value="JP">🇯🇵 JP</option><option value="TH">🇹🇭 TH</option><option value="PH">🇵🇭 PH</option><option value="AU">🇦🇺 AU</option><option value="GB">🇬🇧 GB</option><option value="DE">🇩🇪 DE</option><option value="FR">🇫🇷 FR</option><option value="IN">🇮🇳 IN</option><option value="KR">🇰🇷 KR</option><option value="BR">🇧🇷 BR</option><option value="CA">🇨🇦 CA</option><option value="CN">🇨🇳 CN</option></select></label><form id="loginForm">
<label id="nameLabel" hidden>Nama pengguna<input id="displayName" type="text" autocomplete="name" placeholder="Nama pengguna"></label>
<label>Email<input id="email" type="email" autocomplete="email" placeholder="nama@email.com" required></label>
<label>Kata sandi<input id="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" minlength="6" required></label>
<button id="submitButton" type="submit">Masuk</button>
</form>
<button class="switch" id="switchMode" type="button">Belum punya akun? Daftar</button>
<p class="message" id="message" aria-live="polite"></p>
<a class="back" href="index.html">← Kembali ke DX STORE</a>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js?v=4"></script>
</body>
</html>
