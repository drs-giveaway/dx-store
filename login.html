<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b18">
<title>Masuk | DX STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 10%,#173d72 0,transparent 36%),radial-gradient(circle at 90% 85%,#39256f 0,transparent 34%),#070b18;color:#f4f8ff;font-family:Inter,sans-serif}
.auth-shell{width:min(980px,100%);min-height:590px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid #51e5ff40;border-radius:28px;background:#0d1830;box-shadow:0 24px 90px #0008}
.brand-side{padding:48px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 50% 45%,#238fff40,transparent 48%),linear-gradient(145deg,#13284a,#101329)}
.logo{font-size:25px;font-weight:900;letter-spacing:2px}.logo span,.accent{color:#51e5ff}.visual{display:grid;place-items:center;text-align:center}.visual img,.login-mascot-image{width:min(100%,330px);max-height:320px;object-fit:contain;filter:drop-shadow(0 0 25px #24baff70)}.visual h1{font-size:34px;line-height:1.15;margin:14px 0}
.visual p,.muted{color:#aab8d0;line-height:1.7;font-size:14px}
@media(max-width:720px){.auth-shell{grid-template-columns:1fr;max-width:470px;min-height:auto}.brand-side{padding:22px 25px 10px;min-height:205px}.login-mascot-image{width:120px;height:115px}.visual h1{font-size:22px;margin:5px}.visual p{font-size:12px;margin:0 0 10px}.brand-foot{display:none}.form-side{padding:32px 25px 28px}.form-side h2{font-size:25px}}

/* LOGIN FORM — consistent styling on desktop and mobile */
.form-side{min-width:0;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:16px;background:linear-gradient(145deg,#0e1a34,#0b142b)}
.form-side h2{margin:0;color:#f4f8ff;font-size:clamp(25px,3vw,34px);line-height:1.2;font-weight:800}
.form-side>p{margin:0;color:#d0daea;line-height:1.55}
.form-side label{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;width:100%;min-width:0;color:#e6eefb;font-size:14px;font-weight:600}
#countrySelect{display:block;width:100%;min-height:50px;margin:0!important;padding:13px 14px!important;border:1px solid #314968!important;border-radius:12px!important;background:#071226!important;color:#fff!important;font:inherit}
#loginForm{display:grid;gap:14px;width:100%;margin:0}
#loginForm label{display:grid;gap:8px}
#loginForm input{display:block;width:100%;min-width:0;min-height:50px;margin:0;padding:13px 14px;border:1px solid #314968;border-radius:12px;outline:none;background:#071226;color:#fff;font:inherit;font-size:15px}
#loginForm input::placeholder{color:#8293ad;opacity:1}
#loginForm input:focus,#countrySelect:focus{border-color:#51e5ff!important;box-shadow:0 0 0 3px #51e5ff20}
#submitButton{display:block;width:100%;min-height:50px;margin-top:4px;padding:13px 18px;border:0;border-radius:12px;background:linear-gradient(110deg,#168cf5,#7952ee);color:#fff;font:inherit;font-weight:800}
#submitButton:disabled{opacity:.65;cursor:wait}
.switch{display:block;width:100%;min-height:46px;padding:11px 14px;border:1px solid #36547a;border-radius:11px;background:#142746;color:#aeeeff;font:inherit;font-size:14px;font-weight:700}
.message{min-height:0;margin:0;color:#9eeaff;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.back{display:inline-block;align-self:flex-start;margin-top:4px;color:#72dfff;text-decoration:none;font-weight:600}
.back:hover{text-decoration:underline}
@media(max-width:720px){
 .form-side{padding:30px 25px 28px;gap:15px}
 .form-side h2{font-size:25px}
 #loginForm{gap:13px}
 #loginForm input,#countrySelect{min-height:49px}
}
@media(max-width:360px){
 body{padding:12px}
 .auth-shell{border-radius:20px}
 .brand-side{padding-left:20px;padding-right:20px}
 .form-side{padding:25px 18px}
}

</style>
</head>
<body>
<main class="auth-shell">
<section class="brand-side">
<div class="logo">DX<span>STORE</span></div>
<div class="visual">
<img src="39976-removebg-preview.png" alt="Maskot DX STORE" class="login-mascot-image">
<h1>YOUR DIGITAL<br><span class="accent">WORLD STARTS HERE.</span></h1>
<p>Masuk untuk melanjutkan ke marketplace DX STORE.</p>
</div>
<div class="brand-foot muted">DX STORE · Digital Products &amp; Game Marketplace</div>
</section>
<section class="form-side">
<h2 id="formTitle">Selamat datang kembali</h2>
<p id="formSubtitle">Masuk ke akun DX STORE untuk membuka beranda.</p>
<label for="countrySelect">Negara / Country<select id="countrySelect" autocomplete="country" style="width:100%;margin-top:7px;padding:15px;border:1px solid #314968;border-radius:11px;background:#071226;color:white"><option value="ID">🇮🇩 ID</option><option value="MY">🇲🇾 MY</option><option value="SG">🇸🇬 SG</option><option value="US">🇺🇸 US</option><option value="JP">🇯🇵 JP</option><option value="TH">🇹🇭 TH</option><option value="PH">🇵🇭 PH</option><option value="AU">🇦🇺 AU</option><option value="GB">🇬🇧 GB</option><option value="DE">🇩🇪 DE</option><option value="FR">🇫🇷 FR</option><option value="IN">🇮🇳 IN</option><option value="KR">🇰🇷 KR</option><option value="BR">🇧🇷 BR</option><option value="CA">🇨🇦 CA</option><option value="CN">🇨🇳 CN</option></select></label><form id="loginForm">
<label id="nameLabel" hidden>Nama pengguna<input id="displayName" type="text" autocomplete="name" placeholder="Nama pengguna"></label>
<label>Email<input id="email" type="email" autocomplete="email" placeholder="nama@email.com" required></label>
<label>Kata sandi<input id="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" minlength="6" required></label>
<button id="submitButton" type="submit">Masuk</button>
</form>
<button class="switch" id="switchMode" type="button">Belum punya akun? Daftar</button>
<p class="message" id="message" aria-live="polite"></p>
<a class="back" href="index.html">← Kembali ke DX STORE</a>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js?v=6"></script>
</body>
</html>
